<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Motoseyir · App Store'da indir</title>
<meta name="description" content="Motorcunun navigasyonu: en kısa rota, köy yolları, tur planlama, kurye için çok duraklı sıra.">
<style>
  :root{--paper:#F3F6F6;--ink:#13252C;--dim:#5C7078;--accent:#0B6E7F}
  @media (prefers-color-scheme: dark){:root{--paper:#0C1A20;--ink:#E6EFF0;--dim:#93A9B1;--accent:#4BB3C7}}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:24px}
  main{max-width:560px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .rozet{font-size:56px}
  h1{margin:0;font-size:34px;letter-spacing:-.02em}
  p{margin:0;color:var(--dim)}
  .dugme{display:inline-block;margin-top:10px;padding:14px 22px;border-radius:12px;background:var(--accent);
         color:#fff;text-decoration:none;font-weight:600}
  footer{margin-top:26px;font-size:13px;color:var(--dim)}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="rozet">🏍️</div>
  <h1>Motoseyir</h1>
  <p>Motorcunun navigasyonu. En kısa rota, köy yolları, tur planlama ve kurye için çok duraklı sıra.</p>
  <p>İlk 7 gün tüm özellikler açık. Türkçe ve reklamsız. Şimdilik sadece iOS.</p>
  <a id="indir" class="dugme" href="https://apps.apple.com/tr/app/apple-store/id6792549131?pt=128439797&amp;ct=site&amp;mt=8">App Store'da indir</a>
  <footer><a href="/">motoseyir-app.com</a> · <a href="/gizlilik/">Gizlilik ve Destek</a></footer>
</main>
<script>
  (function () {
    var ct = new URLSearchParams(location.search).get("ct") || "site";
    if (!/^[a-z0-9-]{1,40}$/.test(ct)) ct = "site";
    var link = "https://apps.apple.com/tr/app/apple-store/id6792549131?pt=128439797&ct=" + ct + "&mt=8";
    document.getElementById("indir").href = link;
    var ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/.test(ua) && !/facebookexternalhit|Facebot/i.test(ua)) {
      setTimeout(function () { location.replace(link); }, 600);
    }
  })();
</script>
</body>
</html>
